<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>ASMi Photos</title>
    <!-- Absolute path: /admin is a rewrite, so the default relative lookup would resolve to /config.yml. -->
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
  </head>
  <body>
    <script>window.CMS_MANUAL_INIT = true;</script>
    <script src="https://unpkg.com/decap-cms@3.18.0/dist/decap-cms.js"></script>
    <script>
      // Log in through whichever domain this page is served from (Vercel URL now, custom domain later),
      // merged over the rest of config.yml.
      CMS.init({ config: { backend: { base_url: location.origin } } });
    </script>
  </body>
</html>
